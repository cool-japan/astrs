[workspace]
resolver = "3"
members = [
    # Layer 1 — Substrate
    "crates/astrs-wire",
    "crates/astrs-time",
    "crates/astrs-data",
    "crates/astrs-shm",
    "crates/astrs-transport",
    "crates/astrs-discovery",
    "crates/astrs-store",
    "crates/astrs-yaml",
    # Layer 2 — Domain libraries
    "crates/astrs-manifest",
    "crates/astrs-graph",
    "crates/astrs-scheduler",
    "crates/astrs-recording",
    "crates/astrs-telemetry",
    "crates/astrs-log",
    "crates/astrs-verify",
    "crates/astrs-migrate",
    "crates/astrs-raft",
    # Layer 3 — Orchestration & execution
    "crates/astrs-daemon",
    "crates/astrs-coordinator",
    "crates/astrs-runtime",
    "crates/astrs-node-api",
    "crates/astrs-operator-api",
    "crates/astrs-operator-macros",
    # Layer 2 — ROS 2 interop pillar
    "crates/astrs-cdr",
    "crates/astrs-rtps",
    "crates/astrs-idl",
    "crates/astrs-ros2",
    "crates/astrs-rosbag",
    "crates/astrs-tf",
    "crates/astrs-urdf",
    # Layer 4 — Interfaces
    "crates/astrs-tui",
    "crates/astrs",
    "crates/astrs-capi",
    "crates/astrs-nodes-signal",
    "crates/astrs-nodes-vision",
    "crates/astrs-sim",
    # Example dataflows (§5.4) — each a tiny member crate with a manifest
    "examples/hello-timer",
    "examples/rust-pipeline",
    "examples/service-roundtrip",
    "examples/shm-zero-copy-probe",
    "examples/record-replay",
    "examples/multi-daemon-cluster",
    "examples/restart-policies",
    "examples/error-propagation",
    "examples/benchmark-latency",
    "examples/action-progress",
    "examples/streaming-segments",
    "examples/log-aggregation",
    "examples/dynamic-add-remove",
    "examples/typed-vs-any",
    "examples/module-composition",
    "examples/tui-showcase",
    "examples/ros2-talker-bridge",
    "examples/ros2-native-listener",
    "examples/rosbag-reader",
    "examples/tf-broadcast",
    # Conformance suite (§20.3)
    "tests/conformance",
    # Pure-Rust deep-fuzz estate (§15) — env-gated structured fuzzing with
    # committed regression corpora; cargo-fuzz/libfuzzer is excluded outright
    # by the Pure Rust policy (§18.1) because it links a C++ runtime.
    "tests/fuzz",
    # Criterion latency-ladder bench estate (§20.4)
    "benches/astrs-benches",
    # Binaries
    "bins/astrs-cli",
    "bins/astrs-ros2-bridge-node",
    "bins/astrs-record-node",
    "bins/astrs-replay-node",
    # Repository automation
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["COOLJAPAN OU (Team Kitasan)"]
repository = "https://github.com/cool-japan/astrs"
homepage = "https://github.com/cool-japan/astrs"

[workspace.dependencies]

[package]
name = "astrs-yaml"
description = "AstRS's own pure-Rust YAML 1.2 reader and writer for dataflow manifests."
documentation = "https://docs.rs/astrs-yaml"
readme = "README.md"
keywords = ["astrs", "yaml", "parser", "serde", "config"]
categories = ["parsing", "config", "encoding"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }

[dev-dependencies]
astrs-manifest = { path = "../astrs-manifest" }
glob = { workspace = true }
proptest = { workspace = true }
serde_yaml = { workspace = true }
